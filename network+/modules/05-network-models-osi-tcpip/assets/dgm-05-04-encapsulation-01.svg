<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Encapsulation: data gains a wrapper at each layer</title>
  <desc id="desc">Five stacked rows showing the same data block gaining one more labeled wrapper each row. At the Transport layer a port header makes a segment, at the Network layer an IP header makes a packet, at the Data Link layer a MAC header and trailer make a frame, and at the Physical layer it becomes bits. A down arrow is labeled encapsulation add headers; an up arrow is labeled de-encapsulation remove headers.</desc>

  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">Encapsulation — each layer adds a wrapper (header)</text>

  <!-- rows -->
  <!-- Row 1: Application - DATA -->
  <text x="70" y="80" font-size="13" font-weight="bold" fill="#111">L7 Application</text>
  <rect x="360" y="62" width="120" height="30" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-size="13" fill="#1e40af">DATA</text>
  <text x="760" y="82" font-size="13" font-weight="bold" fill="#166534">= Data</text>

  <!-- Row 2: Transport - Segment -->
  <text x="70" y="140" font-size="13" font-weight="bold" fill="#111">L4 Transport</text>
  <rect x="320" y="122" width="50" height="30" fill="#fde68a" stroke="#78350f" stroke-width="2"/>
  <text x="345" y="142" text-anchor="middle" font-size="11" fill="#78350f">port</text>
  <rect x="370" y="122" width="120" height="30" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="430" y="142" text-anchor="middle" font-size="13" fill="#1e40af">DATA</text>
  <text x="760" y="142" font-size="13" font-weight="bold" fill="#166534">= Segment</text>

  <!-- Row 3: Network - Packet -->
  <text x="70" y="200" font-size="13" font-weight="bold" fill="#111">L3 Network</text>
  <rect x="280" y="182" width="50" height="30" fill="#fdba74" stroke="#7c2d12" stroke-width="2"/>
  <text x="305" y="202" text-anchor="middle" font-size="11" fill="#7c2d12">IP</text>
  <rect x="330" y="182" width="50" height="30" fill="#fde68a" stroke="#78350f" stroke-width="2"/>
  <text x="355" y="202" text-anchor="middle" font-size="11" fill="#78350f">port</text>
  <rect x="380" y="182" width="120" height="30" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="440" y="202" text-anchor="middle" font-size="13" fill="#1e40af">DATA</text>
  <text x="760" y="202" font-size="13" font-weight="bold" fill="#166534">= Packet</text>

  <!-- Row 4: Data Link - Frame -->
  <text x="70" y="260" font-size="13" font-weight="bold" fill="#111">L2 Data Link</text>
  <rect x="240" y="242" width="50" height="30" fill="#86efac" stroke="#14532d" stroke-width="2"/>
  <text x="265" y="262" text-anchor="middle" font-size="11" fill="#14532d">MAC</text>
  <rect x="290" y="242" width="45" height="30" fill="#fdba74" stroke="#7c2d12" stroke-width="2"/>
  <text x="312" y="262" text-anchor="middle" font-size="11" fill="#7c2d12">IP</text>
  <rect x="335" y="242" width="45" height="30" fill="#fde68a" stroke="#78350f" stroke-width="2"/>
  <text x="357" y="262" text-anchor="middle" font-size="10" fill="#78350f">port</text>
  <rect x="380" y="242" width="120" height="30" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#1e40af">DATA</text>
  <rect x="500" y="242" width="55" height="30" fill="#86efac" stroke="#14532d" stroke-width="2"/>
  <text x="527" y="262" text-anchor="middle" font-size="10" fill="#14532d">trailer</text>
  <text x="760" y="262" font-size="13" font-weight="bold" fill="#166534">= Frame</text>

  <!-- Row 5: Physical - Bits -->
  <text x="70" y="320" font-size="13" font-weight="bold" fill="#111">L1 Physical</text>
  <text x="360" y="320" font-size="15" fill="#6d28d9" letter-spacing="2">1011010100110101…</text>
  <text x="760" y="320" font-size="13" font-weight="bold" fill="#166534">= Bits</text>

  <!-- direction arrows -->
  <line x1="600" y1="55" x2="600" y2="330" stroke="#b91c1c" stroke-width="3" marker-end="url(#dn)"/>
  <text x="618" y="195" font-size="12" fill="#b91c1c" transform="rotate(90 618 195)" text-anchor="middle">encapsulation (add headers)</text>
  <line x1="40" y1="330" x2="40" y2="55" stroke="#166534" stroke-width="3" marker-end="url(#up)"/>
  <text x="24" y="195" font-size="12" fill="#166534" transform="rotate(-90 24 195)" text-anchor="middle">de-encapsulation (remove)</text>

  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,0 L4,7 z" fill="#b91c1c"/>
    </marker>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4" refY="0" orient="auto" markerUnits="strokeWidth">
      <path d="M0,7 L8,7 L4,0 z" fill="#166534"/>
    </marker>
  </defs>

  <rect x="110" y="360" width="680" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Order going down: Data → Segment → Packet → Frame → Bits</text>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#333">The DATA block never changes — each layer only wraps it with its own label.</text>
  <text x="450" y="434" text-anchor="middle" font-size="12" fill="#333">Address names the layer: IP → packet (L3) · MAC → frame (L2).</text>
</svg>
