<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">One complex task split into a stack of simple layers</title>
  <desc id="desc">On the left, a messy cloud labeled open a web page, complex. An arrow points right to a tidy stack of four labeled layers from top to bottom: app, address, move, and signal. A down arrow beside the stack is marked to send and an up arrow is marked to receive.</desc>

  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">A model turns one big task into a stack of small jobs</text>

  <!-- messy cloud -->
  <ellipse cx="170" cy="220" rx="120" ry="85" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="170" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Open a web page</text>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#b91c1c">(one huge, messy task)</text>
  <text x="170" y="250" text-anchor="middle" font-size="18" fill="#b91c1c">?  ?  ?</text>

  <!-- arrow -->
  <line x1="300" y1="220" x2="380" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#334155">split into</text>
  <text x="340" y="245" text-anchor="middle" font-size="12" fill="#334155">layers</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- stack of 4 layers -->
  <g stroke="#334155" stroke-width="2">
    <rect x="420" y="90"  width="340" height="70" rx="6" fill="#dbeafe"/>
    <rect x="420" y="160" width="340" height="70" rx="6" fill="#dcfce7"/>
    <rect x="420" y="230" width="340" height="70" rx="6" fill="#fef9c3"/>
    <rect x="420" y="300" width="340" height="70" rx="6" fill="#ede9fe"/>
  </g>
  <g text-anchor="start">
    <text x="440" y="122" font-size="15" font-weight="bold" fill="#1e40af">App layer</text>
    <text x="440" y="142" font-size="12" fill="#1e40af">your browser (closest to you)</text>
    <text x="440" y="192" font-size="15" font-weight="bold" fill="#166534">Address layer</text>
    <text x="440" y="212" font-size="12" fill="#166534">where the data should go</text>
    <text x="440" y="262" font-size="15" font-weight="bold" fill="#a16207">Move layer</text>
    <text x="440" y="282" font-size="12" fill="#a16207">send it across the network</text>
    <text x="440" y="332" font-size="15" font-weight="bold" fill="#6d28d9">Signal layer</text>
    <text x="440" y="352" font-size="12" fill="#6d28d9">cable or Wi-Fi (physical link)</text>
  </g>

  <!-- send/receive arrows -->
  <line x1="790" y1="100" x2="790" y2="360" stroke="#b91c1c" stroke-width="3" marker-end="url(#down)"/>
  <text x="800" y="235" font-size="12" fill="#b91c1c" transform="rotate(90 800 235)" text-anchor="middle">DOWN = to send</text>
  <line x1="400" y1="360" x2="400" y2="100" stroke="#166534" stroke-width="3" marker-end="url(#up)"/>
  <text x="390" y="235" font-size="12" fill="#166534" transform="rotate(-90 390 235)" text-anchor="middle">UP = to receive</text>

  <defs>
    <marker id="down" markerWidth="9" markerHeight="9" refX="4" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,0 L4,7 z" fill="#b91c1c"/>
    </marker>
    <marker id="up" markerWidth="9" markerHeight="9" refX="4" refY="0" orient="auto" markerUnits="strokeWidth">
      <path d="M0,7 L8,7 L4,0 z" fill="#166534"/>
    </marker>
  </defs>

  <text x="450" y="405" text-anchor="middle" font-size="12" fill="#475569">Ask "which layer?" to find a problem fast. (Real layer names come next lesson.)</text>
</svg>
