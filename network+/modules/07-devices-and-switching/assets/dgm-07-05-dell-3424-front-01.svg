<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Front panel of a Dell PowerConnect 3424 managed switch</title>
  <desc id="desc">A labeled front panel of a Dell PowerConnect 3424 managed switch. On the left are a power LED and a system LED. Across the middle is a row of 24 numbered 10/100 access ports, each with a small link and activity light, where devices plug in. To the right is a small group of faster Gigabit uplink ports that connect the switch up to a router or core switch, and one SFP module slot that can hold a fiber or special copper module. Below, set apart, is a console port marked management only, used for the first login with a console cable. A caption reminds that a managed switch can be logged in and configured, while an unmanaged switch just forwards frames.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Dell PowerConnect 3424 — front panel (managed switch)</text>

  <!-- switch chassis -->
  <rect x="40" y="60" width="820" height="150" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>

  <!-- status LEDs -->
  <circle cx="72" cy="95" r="7" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="88" y="99" font-size="11" font-weight="bold" fill="#14532d">PWR</text>
  <circle cx="72" cy="120" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="88" y="124" font-size="11" font-weight="bold" fill="#1e3a8a">SYS</text>
  <text x="66" y="150" font-size="9" fill="#475569">power &amp;</text>
  <text x="66" y="162" font-size="9" fill="#475569">system LEDs</text>

  <!-- access ports row -->
  <text x="330" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Access ports 1–24 (10/100 RJ45) — devices plug in here</text>
  <g>
    <!-- 24 ports drawn as small rectangles with a link dot -->
    <!-- row generated: x from 150, step 26 -->
    <g fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5">
      <rect x="150" y="95" width="20" height="26" rx="2"/>
      <rect x="176" y="95" width="20" height="26" rx="2"/>
      <rect x="202" y="95" width="20" height="26" rx="2"/>
      <rect x="228" y="95" width="20" height="26" rx="2"/>
      <rect x="254" y="95" width="20" height="26" rx="2"/>
      <rect x="280" y="95" width="20" height="26" rx="2"/>
      <rect x="306" y="95" width="20" height="26" rx="2"/>
      <rect x="332" y="95" width="20" height="26" rx="2"/>
      <rect x="358" y="95" width="20" height="26" rx="2"/>
      <rect x="384" y="95" width="20" height="26" rx="2"/>
      <rect x="410" y="95" width="20" height="26" rx="2"/>
      <rect x="436" y="95" width="20" height="26" rx="2"/>
      <rect x="462" y="95" width="20" height="26" rx="2"/>
      <rect x="488" y="95" width="20" height="26" rx="2"/>
      <rect x="514" y="95" width="20" height="26" rx="2"/>
      <rect x="540" y="95" width="20" height="26" rx="2"/>
      <rect x="566" y="95" width="20" height="26" rx="2"/>
      <rect x="592" y="95" width="20" height="26" rx="2"/>
      <rect x="618" y="95" width="20" height="26" rx="2"/>
      <rect x="644" y="95" width="20" height="26" rx="2"/>
      <rect x="670" y="95" width="20" height="26" rx="2"/>
    </g>
    <!-- first and last labels -->
    <text x="160" y="113" text-anchor="middle" font-size="9" fill="#312e81">1</text>
    <text x="680" y="113" text-anchor="middle" font-size="9" fill="#312e81">24</text>
    <!-- link/activity dots under a few ports -->
    <g fill="#f59e0b">
      <circle cx="160" cy="130" r="2.5"/>
      <circle cx="290" cy="130" r="2.5"/>
      <circle cx="420" cy="130" r="2.5"/>
      <circle cx="550" cy="130" r="2.5"/>
      <circle cx="680" cy="130" r="2.5"/>
    </g>
    <text x="330" y="150" text-anchor="middle" font-size="9" fill="#475569">each port has a link / activity light (shows a live connection)</text>
  </g>

  <!-- uplink / gigabit group -->
  <rect x="720" y="90" width="80" height="36" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="760" y="106" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">G1  G2</text>
  <text x="760" y="119" text-anchor="middle" font-size="8" fill="#14532d">Gigabit uplink</text>
  <!-- SFP slot -->
  <rect x="808" y="90" width="40" height="36" rx="3" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="828" y="106" text-anchor="middle" font-size="9" font-weight="bold" fill="#78350f">SFP</text>
  <text x="828" y="118" text-anchor="middle" font-size="7" fill="#78350f">module</text>
  <text x="760" y="150" text-anchor="middle" font-size="9" fill="#475569">faster ports → up to a router / core switch</text>

  <!-- verify note -->
  <text x="450" y="195" text-anchor="middle" font-size="9" fill="#64748b">Exact count and layout of Gigabit / SFP ports and LED colors vary by unit — verify on your hardware.</text>

  <!-- console port callout -->
  <rect x="150" y="250" width="260" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="280" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">CONSOLE PORT</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#5b21b6">management only (serial)</text>
  <text x="280" y="313" text-anchor="middle" font-size="10" fill="#6d28d9">used for the FIRST login — not for network traffic</text>

  <!-- managed vs unmanaged comparison -->
  <rect x="470" y="245" width="380" height="80" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="660" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Managed vs. unmanaged</text>
  <text x="490" y="292" font-size="11" fill="#166534" font-weight="bold">✓ Managed</text>
  <text x="565" y="292" font-size="10" fill="#14532d">= log in &amp; configure (your 3424)</text>
  <text x="490" y="312" font-size="11" fill="#b91c1c" font-weight="bold">– Unmanaged</text>
  <text x="575" y="312" font-size="10" fill="#7f1d1d">= no settings; just forwards</text>

  <!-- legend / key at bottom -->
  <rect x="150" y="360" width="700" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="384" font-size="11" fill="#111"><tspan font-weight="bold">Access port</tspan> = a device (PC) plugs in here.</text>
  <text x="170" y="404" font-size="11" fill="#111"><tspan font-weight="bold">Uplink / Gigabit port</tspan> = faster link up to a router or core switch.</text>
  <text x="170" y="424" font-size="11" fill="#111"><tspan font-weight="bold">SFP slot</tspan> = holds a plug-in module (often fiber). <tspan font-weight="bold">Console port</tspan> = management only.</text>
</svg>
