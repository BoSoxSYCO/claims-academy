<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Static versus dynamic routing</title>
  <desc id="desc">Two side-by-side panels showing the two ways to fill a routing table. The left panel, Static by hand, shows a person typing a route that says to reach network 192.168.20.0/24 send traffic to 10.0.0.2, with a note that it does not reroute on its own. The right panel, Dynamic learned, shows several routers exchanging route information using protocols named OSPF, EIGRP, and BGP, with a note that the table updates automatically when a path changes. A summary bar reads: small or fixed networks use static, large or changing networks use dynamic.</desc>

  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2a3a">Two ways to fill a routing table</text>

  <!-- Static panel -->
  <rect x="30" y="60" width="330" height="300" rx="10" fill="#eaf3fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="195" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b6cb0">STATIC — by hand ✍</text>
  <rect x="55" y="110" width="280" height="90" rx="6" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="70" y="135" font-size="13" font-family="Consolas, monospace" fill="#1a2a3a">You type:</text>
  <text x="70" y="158" font-size="13" font-family="Consolas, monospace" fill="#1a2a3a">to reach 192.168.20.0/24</text>
  <text x="70" y="180" font-size="13" font-family="Consolas, monospace" fill="#1a2a3a">   → send to 10.0.0.2</text>
  <text x="195" y="232" text-anchor="middle" font-size="13" fill="#1a2a3a">Stays exactly as typed.</text>
  <text x="195" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#9b2c2c">✗ no auto-reroute if a link fails</text>
  <text x="195" y="300" text-anchor="middle" font-size="13" fill="#1a2a3a">✓ simple · predictable</text>
  <text x="195" y="322" text-anchor="middle" font-size="13" fill="#1a2a3a">✓ no extra traffic</text>

  <!-- Dynamic panel -->
  <rect x="400" y="60" width="330" height="300" rx="10" fill="#eafbf0" stroke="#2f855a" stroke-width="2"/>
  <text x="565" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f855a">DYNAMIC — learned 🛰</text>
  <text x="565" y="122" text-anchor="middle" font-size="13" fill="#1a2a3a">Routers share what they know:</text>
  <!-- little routers -->
  <circle cx="470" cy="165" r="24" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="470" y="169" text-anchor="middle" font-size="11" fill="#1a2a3a">R1</text>
  <circle cx="565" cy="165" r="24" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="565" y="169" text-anchor="middle" font-size="11" fill="#1a2a3a">R2</text>
  <circle cx="660" cy="165" r="24" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="660" y="169" text-anchor="middle" font-size="11" fill="#1a2a3a">R3</text>
  <line x1="494" y1="165" x2="541" y2="165" stroke="#2f855a" stroke-width="2"/>
  <line x1="589" y1="165" x2="636" y2="165" stroke="#2f855a" stroke-width="2"/>
  <text x="565" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f855a">OSPF · EIGRP · BGP</text>
  <text x="565" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f855a">✓ auto-updates when a path changes</text>
  <text x="565" y="300" text-anchor="middle" font-size="13" fill="#1a2a3a">✓ scales to many networks</text>
  <text x="565" y="322" text-anchor="middle" font-size="13" fill="#1a2a3a">✗ more setup · some traffic</text>

  <rect x="30" y="380" width="700" height="60" rx="8" fill="#f2f2f2" stroke="#4a5568" stroke-width="2"/>
  <text x="380" y="407" text-anchor="middle" font-size="14" fill="#1a2a3a"><tspan font-weight="bold">Small / fixed</tspan> network → static.   <tspan font-weight="bold">Large / changing</tspan> network → dynamic. (Many use both.)</text>
  <text x="380" y="429" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">Each panel is titled in words — the labels, not color, carry the meaning.</text>
</svg>
