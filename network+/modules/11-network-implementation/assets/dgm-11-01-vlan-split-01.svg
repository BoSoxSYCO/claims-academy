<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">One switch split into two VLANs</title>
  <desc id="desc">One physical switch split into two VLANs. Ports 1 to 3 form VLAN 10, labeled Sales, on subnet 192.168.10.0/24. Ports 4 to 6 form VLAN 20, labeled Engineering, on subnet 192.168.20.0/24. Broadcasts stay inside each VLAN, so the two groups cannot hear each other. A router on the right connects to both VLANs, showing that traffic moving between VLAN 10 and VLAN 20 must pass through the router.</desc>

  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2a3a">One switch, two VLANs</text>

  <!-- Switch -->
  <rect x="60" y="60" width="440" height="70" rx="8" fill="#e8e8ef" stroke="#4a5568" stroke-width="2"/>
  <text x="280" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2a3a">Physical switch (Dell PowerConnect 3424)</text>
  <!-- ports -->
  <g font-size="12" fill="#1a2a3a" text-anchor="middle">
    <rect x="80" y="95" width="50" height="26" rx="3" fill="#cfe3f7" stroke="#2b6cb0"/><text x="105" y="112">1</text>
    <rect x="135" y="95" width="50" height="26" rx="3" fill="#cfe3f7" stroke="#2b6cb0"/><text x="160" y="112">2</text>
    <rect x="190" y="95" width="50" height="26" rx="3" fill="#cfe3f7" stroke="#2b6cb0"/><text x="215" y="112">3</text>
    <rect x="260" y="95" width="50" height="26" rx="3" fill="#d5f0df" stroke="#2f855a"/><text x="285" y="112">4</text>
    <rect x="315" y="95" width="50" height="26" rx="3" fill="#d5f0df" stroke="#2f855a"/><text x="340" y="112">5</text>
    <rect x="370" y="95" width="50" height="26" rx="3" fill="#d5f0df" stroke="#2f855a"/><text x="395" y="112">6</text>
  </g>

  <!-- VLAN 10 group -->
  <rect x="60" y="170" width="200" height="150" rx="8" fill="#eaf3fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="160" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">VLAN 10 — Sales</text>
  <text x="160" y="216" text-anchor="middle" font-size="12.5" fill="#1a2a3a">ports 1–3</text>
  <text x="160" y="236" text-anchor="middle" font-size="12.5" fill="#1a2a3a">192.168.10.0/24</text>
  <text x="160" y="270" text-anchor="middle" font-size="24">💻 💻 💻</text>
  <text x="160" y="302" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555">broadcasts stay inside</text>

  <!-- VLAN 20 group -->
  <rect x="300" y="170" width="200" height="150" rx="8" fill="#eafbf0" stroke="#2f855a" stroke-width="2"/>
  <text x="400" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f855a">VLAN 20 — Engineering</text>
  <text x="400" y="216" text-anchor="middle" font-size="12.5" fill="#1a2a3a">ports 4–6</text>
  <text x="400" y="236" text-anchor="middle" font-size="12.5" fill="#1a2a3a">192.168.20.0/24</text>
  <text x="400" y="270" text-anchor="middle" font-size="24">💻 💻 💻</text>
  <text x="400" y="302" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555">broadcasts stay inside</text>

  <!-- links switch to groups -->
  <line x1="160" y1="130" x2="160" y2="170" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="400" y1="130" x2="400" y2="170" stroke="#2f855a" stroke-width="2"/>

  <!-- Router -->
  <circle cx="640" cy="245" r="55" fill="#fbf3ea" stroke="#c05621" stroke-width="2"/>
  <text x="640" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">ROUTER</text>
  <text x="640" y="260" text-anchor="middle" font-size="11.5" fill="#1a2a3a">Layer 3</text>
  <line x1="260" y1="220" x2="586" y2="235" stroke="#c05621" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="500" y1="230" x2="588" y2="250" stroke="#c05621" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="60" y="360" width="640" height="60" rx="8" fill="#f2f2f2" stroke="#4a5568" stroke-width="2"/>
  <text x="380" y="386" text-anchor="middle" font-size="14" fill="#1a2a3a">The two VLANs cannot hear each other directly.</text>
  <text x="380" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#c05621">To send between VLAN 10 and VLAN 20 → traffic must go through the router.</text>

  <text x="380" y="452" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">Color plus a text label and a port range mark each VLAN — color never stands alone.</text>
</svg>
