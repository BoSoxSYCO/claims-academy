<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Wi-Fi standards, bands, and security at a glance</title>
  <desc id="desc">A three-part Wi-Fi overview. Top strip, standards: 802.11a, b, g, then n labeled Wi-Fi 4, ac labeled Wi-Fi 5, and ax labeled Wi-Fi 6, with newer meaning faster. Middle strip, bands: 2.4 GHz reaches farther but is slower and crowded, while 5 GHz is faster but has shorter range; the 2.4 GHz non-overlapping channels 1, 6, and 11 are marked. Bottom strip, security from worst to best: WEP marked unsafe with an X, then WPA, then WPA2, then WPA3 marked best with a check. A caption says pick a standard for speed, a band and channel for space, and WPA2 or WPA3 for safety.</desc>

  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2a3a">Wi-Fi at a glance</text>

  <!-- STANDARDS strip -->
  <rect x="25" y="52" width="710" height="120" rx="10" fill="#eaf3fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="42" y="78" font-size="15" font-weight="bold" fill="#2b6cb0">STANDARDS (802.11) — newer = faster →</text>
  <text x="45" y="108" font-size="13.5" fill="#1a2a3a">802.11a · 802.11b · 802.11g</text>
  <text x="45" y="134" font-size="13.5" fill="#1a2a3a">802.11n = <tspan font-weight="bold">Wi-Fi 4</tspan>   ·   802.11ac = <tspan font-weight="bold">Wi-Fi 5</tspan>   ·   802.11ax = <tspan font-weight="bold">Wi-Fi 6</tspan></text>
  <text x="45" y="158" font-size="12" font-style="italic" fill="#555">All backward-compatible: a new router still serves old devices.</text>

  <!-- BANDS strip -->
  <rect x="25" y="184" width="710" height="130" rx="10" fill="#eafbf0" stroke="#2f855a" stroke-width="2"/>
  <text x="42" y="210" font-size="15" font-weight="bold" fill="#2f855a">BANDS</text>
  <rect x="45" y="222" width="320" height="76" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="60" y="245" font-size="13.5" font-weight="bold" fill="#1a2a3a">2.4 GHz</text>
  <text x="60" y="267" font-size="12.5" fill="#1a2a3a">farther · slower · crowded</text>
  <text x="60" y="288" font-size="12.5" fill="#1a2a3a">non-overlapping channels: 1 · 6 · 11</text>
  <rect x="395" y="222" width="320" height="76" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="410" y="245" font-size="13.5" font-weight="bold" fill="#1a2a3a">5 GHz</text>
  <text x="410" y="267" font-size="12.5" fill="#1a2a3a">faster · shorter reach</text>
  <text x="410" y="288" font-size="12.5" fill="#1a2a3a">many more non-overlapping channels</text>

  <!-- SECURITY strip -->
  <rect x="25" y="326" width="710" height="110" rx="10" fill="#fbf3ea" stroke="#c05621" stroke-width="2"/>
  <text x="42" y="352" font-size="15" font-weight="bold" fill="#c05621">SECURITY — worst → best</text>
  <text x="45" y="388" font-size="16" fill="#1a2a3a"><tspan font-weight="bold" fill="#9b2c2c">WEP ✗</tspan>  &lt;  WPA  &lt;  WPA2  &lt;  <tspan font-weight="bold" fill="#2f855a">WPA3 ✓</tspan></text>
  <text x="45" y="414" font-size="12.5" font-style="italic" fill="#555">WEP is broken — never use it. SSID = the network name (hiding it is not real security).</text>

  <text x="380" y="466" text-anchor="middle" font-size="13" fill="#1a2a3a">Pick a <tspan font-weight="bold">standard</tspan> for speed, a <tspan font-weight="bold">band + channel</tspan> for space, and <tspan font-weight="bold">WPA2/WPA3</tspan> for safety.</text>
  <text x="380" y="492" text-anchor="middle" font-size="11.5" font-style="italic" fill="#777">Each strip is labeled in words; security uses ✗/✓ and worst/best text, never color alone.</text>
</svg>
