<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Hardening the access layer: switch ports and wireless</title>
  <desc id="desc">Two panels under the heading Harden the access layer. Left panel, Switch ports: use port security to allow only known MAC addresses; use sticky MAC so a port locks to the first device; disable unused ports; and move the native VLAN off VLAN 1. Right panel, Wireless: choose Wi-Fi security in this order — WPA3 is best, WPA2 is okay, and WEP should never be used; set a strong PSK, which is the Wi-Fi password; change the default SSID and the router's admin password; turn off WPS; and add a separate guest network for visitors.</desc>

  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2b4a">Harden the access layer</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#54606e">Lock the wired doors (ports) and the wireless doors (Wi-Fi)</text>

  <!-- Switch panel -->
  <rect x="24" y="72" width="344" height="368" rx="10" fill="#eef4fb" stroke="#2f6db0" stroke-width="2"/>
  <rect x="24" y="72" width="344" height="34" rx="10" fill="#2f6db0"/>
  <text x="196" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Switch ports (wired)</text>
  <text x="44" y="140" font-size="13" font-weight="bold" fill="#1a2b4a">Port security</text>
  <text x="44" y="160" font-size="12" fill="#54606e">allow only known MAC addresses</text>
  <text x="44" y="196" font-size="13" font-weight="bold" fill="#1a2b4a">Sticky MAC</text>
  <text x="44" y="216" font-size="12" fill="#54606e">port locks to the first device</text>
  <text x="44" y="252" font-size="13" font-weight="bold" fill="#1a2b4a">Disable unused ports</text>
  <text x="44" y="272" font-size="12" fill="#54606e">an open port is an open door</text>
  <text x="44" y="308" font-size="13" font-weight="bold" fill="#1a2b4a">Move the native VLAN</text>
  <text x="44" y="328" font-size="12" fill="#54606e">off the default VLAN 1</text>
  <text x="44" y="392" font-size="12" fill="#9b2d2d">Dell 3424 port commands:</text>
  <text x="44" y="410" font-size="12" fill="#9b2d2d">[TO VERIFY ON HARDWARE]</text>

  <!-- Wireless panel -->
  <rect x="392" y="72" width="344" height="368" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2"/>
  <rect x="392" y="72" width="344" height="34" rx="10" fill="#2e8b57"/>
  <text x="564" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Wireless (Wi-Fi)</text>
  <text x="412" y="136" font-size="13" font-weight="bold" fill="#1a2b4a">Pick the strongest security:</text>
  <rect x="412" y="146" width="100" height="26" rx="6" fill="#d7ead9" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="462" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2b4a">WPA3 — best</text>
  <rect x="520" y="146" width="90" height="26" rx="6" fill="#eef4ea" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="565" y="164" text-anchor="middle" font-size="12" fill="#1a2b4a">WPA2 — ok</text>
  <rect x="618" y="146" width="96" height="26" rx="6" fill="#f7dede" stroke="#9b2d2d" stroke-width="1.2"/>
  <text x="666" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#9b2d2d">WEP — never</text>
  <text x="412" y="204" font-size="13" fill="#1a2b4a">• Strong <tspan font-weight="bold">PSK</tspan> (Wi-Fi password)</text>
  <text x="412" y="236" font-size="13" fill="#1a2b4a">• Change default <tspan font-weight="bold">SSID</tspan> + admin pw</text>
  <text x="412" y="268" font-size="13" fill="#1a2b4a">• Turn <tspan font-weight="bold">WPS</tspan> OFF</text>
  <text x="412" y="300" font-size="13" fill="#1a2b4a">• Add a <tspan font-weight="bold">guest network</tspan></text>
  <text x="412" y="392" font-size="12" fill="#54606e">Check on Windows:</text>
  <text x="412" y="412" font-size="12" fill="#1a2b4a" font-family="Consolas, monospace">netsh wlan show interfaces</text>
</svg>
