<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Common network attacks, grouped in three cards</title>
  <desc id="desc">A banner reads: Attack equals Threat plus Vulnerability. Below are three cards. Card one, Trick people: social engineering tricks a person into breaking security; phishing is a fake message that steals secrets; both mainly break confidentiality. Card two, Bad software: malware is any harmful software; ransomware locks your files and demands money, breaking availability. Card three, Hit the network: spoofing fakes a trusted identity; an on-path attack secretly sits between two parties to read or change traffic, breaking confidentiality or integrity; a DoS or DDoS attack floods a service so real users cannot reach it, breaking availability.</desc>

  <rect x="0" y="0" width="760" height="500" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">Common attacks</text>

  <!-- Banner -->
  <rect x="150" y="52" width="460" height="40" rx="8" fill="#1a2b4a"/>
  <text x="380" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Attack = Threat (danger) + Vulnerability (weak spot)</text>

  <!-- Card 1: Trick people -->
  <rect x="24" y="112" width="228" height="356" rx="10" fill="#eef4fb" stroke="#2f6db0" stroke-width="2"/>
  <rect x="24" y="112" width="228" height="32" rx="10" fill="#2f6db0"/>
  <text x="138" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1 · Trick people</text>
  <text x="40" y="172" font-size="13" font-weight="bold" fill="#1a2b4a">Social engineering</text>
  <text x="40" y="190" font-size="12" fill="#54606e">trick a person into</text>
  <text x="40" y="206" font-size="12" fill="#54606e">breaking security</text>
  <text x="40" y="226" font-size="11" fill="#9b2d2d">breaks: Confidentiality</text>
  <text x="40" y="262" font-size="13" font-weight="bold" fill="#1a2b4a">Phishing</text>
  <text x="40" y="280" font-size="12" fill="#54606e">fake message steals</text>
  <text x="40" y="296" font-size="12" fill="#54606e">your secrets</text>
  <text x="40" y="316" font-size="11" fill="#9b2d2d">breaks: Confidentiality</text>

  <!-- Card 2: Bad software -->
  <rect x="266" y="112" width="228" height="356" rx="10" fill="#eaf6ee" stroke="#2e8b57" stroke-width="2"/>
  <rect x="266" y="112" width="228" height="32" rx="10" fill="#2e8b57"/>
  <text x="380" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2 · Bad software</text>
  <text x="282" y="172" font-size="13" font-weight="bold" fill="#1a2b4a">Malware</text>
  <text x="282" y="190" font-size="12" fill="#54606e">any harmful software</text>
  <text x="282" y="206" font-size="12" fill="#54606e">(viruses, worms)</text>
  <text x="282" y="226" font-size="11" fill="#9b2d2d">breaks: C / I / A</text>
  <text x="282" y="262" font-size="13" font-weight="bold" fill="#1a2b4a">Ransomware</text>
  <text x="282" y="280" font-size="12" fill="#54606e">locks your files,</text>
  <text x="282" y="296" font-size="12" fill="#54606e">demands money</text>
  <text x="282" y="316" font-size="11" fill="#9b2d2d">breaks: Availability</text>

  <!-- Card 3: Hit the network -->
  <rect x="508" y="112" width="228" height="356" rx="10" fill="#fdf3e7" stroke="#c07f2f" stroke-width="2"/>
  <rect x="508" y="112" width="228" height="32" rx="10" fill="#c07f2f"/>
  <text x="622" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3 · Hit the network</text>
  <text x="524" y="172" font-size="13" font-weight="bold" fill="#1a2b4a">Spoofing</text>
  <text x="524" y="190" font-size="12" fill="#54606e">fake a trusted identity</text>
  <text x="524" y="210" font-size="11" fill="#9b2d2d">breaks: varies</text>
  <text x="524" y="246" font-size="13" font-weight="bold" fill="#1a2b4a">On-path attack</text>
  <text x="524" y="264" font-size="12" fill="#54606e">secretly read / change</text>
  <text x="524" y="280" font-size="12" fill="#54606e">traffic in the middle</text>
  <text x="524" y="300" font-size="11" fill="#9b2d2d">breaks: Confidentiality / Integrity</text>
  <text x="524" y="336" font-size="13" font-weight="bold" fill="#1a2b4a">DoS / DDoS</text>
  <text x="524" y="354" font-size="12" fill="#54606e">flood a service offline</text>
  <text x="524" y="374" font-size="11" fill="#9b2d2d">breaks: Availability</text>

  <text x="380" y="490" text-anchor="middle" font-size="12" fill="#54606e">Every attack targets a CIA goal — read secrets (C), change data (I), or knock offline (A).</text>
</svg>
