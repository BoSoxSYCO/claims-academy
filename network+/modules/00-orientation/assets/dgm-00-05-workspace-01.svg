<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="ws-title ws-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="ws-title">A safe workspace and a lab notebook</title>
  <desc id="ws-desc">A tidy workspace near power and light, with the four gear pieces grouped and cables tidy. A lab notebook shows three columns: date, what you did, and what you saw. A safety box lists the rules, and a pre-lab checklist strip reminds you what to confirm before each session.</desc>

  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#12263a">A safe workspace + a lab notebook</text>

  <!-- Workspace box -->
  <rect x="30" y="52" width="400" height="150" rx="10" fill="#eef3f8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="48" y="76" font-size="13" font-weight="bold" fill="#12263a">Your workspace</text>
  <text x="48" y="98" font-size="12" fill="#3a4a5a">⚡ near a power outlet   💡 good light</text>
  <!-- gear grouped -->
  <rect x="48" y="112" width="80" height="34" rx="5" fill="#fdf0d5" stroke="#b5852a" stroke-width="1.5"/>
  <text x="88" y="134" text-anchor="middle" font-size="11" fill="#12263a">Laptop</text>
  <rect x="138" y="112" width="80" height="34" rx="5" fill="#e6e0f2" stroke="#5b4a8a" stroke-width="1.5"/>
  <text x="178" y="134" text-anchor="middle" font-size="11" fill="#12263a">Switch</text>
  <rect x="228" y="112" width="80" height="34" rx="5" fill="#dbeadd" stroke="#2e7d5b" stroke-width="1.5"/>
  <text x="268" y="134" text-anchor="middle" font-size="11" fill="#12263a">Router</text>
  <rect x="318" y="112" width="90" height="34" rx="5" fill="#f4f6f9" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="363" y="130" text-anchor="middle" font-size="10" fill="#12263a">Cables</text>
  <text x="363" y="142" text-anchor="middle" font-size="9" fill="#3a4a5a">(tidy, labeled)</text>
  <text x="48" y="176" font-size="11" fill="#3a4a5a">Keep the gear together · tidy the cables · label them</text>
  <text x="48" y="192" font-size="11" fill="#3a4a5a">("to router," "Port 1")</text>

  <!-- Lab notebook -->
  <rect x="450" y="52" width="240" height="150" rx="10" fill="#ffffff" stroke="#12263a" stroke-width="2"/>
  <text x="570" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#12263a">Lab notebook</text>
  <line x1="530" y1="88" x2="530" y2="192" stroke="#cbd5df" stroke-width="1"/>
  <line x1="610" y1="88" x2="610" y2="192" stroke="#cbd5df" stroke-width="1"/>
  <text x="490" y="104" text-anchor="middle" font-size="10" fill="#12263a">date</text>
  <text x="570" y="104" text-anchor="middle" font-size="10" fill="#12263a">what</text>
  <text x="570" y="116" text-anchor="middle" font-size="10" fill="#12263a">you did</text>
  <text x="650" y="104" text-anchor="middle" font-size="10" fill="#12263a">what</text>
  <text x="650" y="116" text-anchor="middle" font-size="10" fill="#12263a">you saw</text>
  <line x1="460" y1="128" x2="680" y2="128" stroke="#e0e6ee" stroke-width="1"/>
  <line x1="460" y1="150" x2="680" y2="150" stroke="#e0e6ee" stroke-width="1"/>
  <line x1="460" y1="172" x2="680" y2="172" stroke="#e0e6ee" stroke-width="1"/>
  <text x="570" y="192" text-anchor="middle" font-size="9" fill="#3a4a5a">a form of documentation</text>

  <!-- Safety box -->
  <rect x="30" y="222" width="660" height="88" rx="10" fill="#fde8e8" stroke="#b5452a" stroke-width="2"/>
  <text x="48" y="246" font-size="13" font-weight="bold" fill="#12263a">Safety</text>
  <text x="48" y="270" font-size="12" fill="#12263a">· Don't force a connector — the RJ45 clicks in gently.</text>
  <text x="48" y="290" font-size="12" fill="#12263a">· Power down to move cables · keep drinks away · protect the shared switch (change only what you were told to).</text>

  <!-- Pre-lab checklist -->
  <rect x="30" y="330" width="660" height="70" rx="10" fill="#dbeadd" stroke="#2e7d5b" stroke-width="2"/>
  <text x="360" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#12263a">Pre-lab checklist</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#12263a">outlet reachable? · space clear? · notebook open with today's date? · which lesson or lab?</text>

  <text x="360" y="440" text-anchor="middle" font-size="14" fill="#12263a">Set the space, stay safe, and write it down.</text>
  <text x="360" y="464" text-anchor="middle" font-size="12" fill="#3a4a5a">You finished the on-ramp — the real building starts in Module 01.</text>
</svg>
