<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">A subnet mask marks the network and host parts of an address</title>
  <desc id="desc">An IP address 192.168.1.10 shown above a subnet mask 255.255.255.0. The first three octets, where the mask is 255, are marked as the network portion (192.168.1); the last octet, where the mask is 0, is marked as the host portion (10). A table shows default masks: Class A 255.0.0.0, Class B 255.255.0.0, and Class C 255.255.255.0. A comparison shows that 192.168.1.10 and 192.168.1.20 are on the same network, so a device delivers directly, while 192.168.1.10 and 192.168.2.20 are on different networks, so the device sends the data to the router.</desc>

  <rect x="0" y="0" width="900" height="490" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">A subnet mask marks network vs. host</text>

  <!-- address + mask -->
  <text x="120" y="72" font-size="14" font-weight="bold" fill="#111">IP</text>
  <text x="110" y="112" font-size="14" font-weight="bold" fill="#111">Mask</text>

  <!-- network octets shaded green -->
  <g>
    <rect x="170" y="55" width="80" height="70" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <rect x="255" y="55" width="80" height="70" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <rect x="340" y="55" width="80" height="70" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <rect x="425" y="55" width="80" height="70" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  </g>
  <g font-family="monospace" font-size="17" text-anchor="middle">
    <text x="210" y="80" fill="#14532d">192</text>
    <text x="295" y="80" fill="#14532d">168</text>
    <text x="380" y="80" fill="#14532d">1</text>
    <text x="465" y="80" fill="#5b21b6">10</text>
    <text x="210" y="112" fill="#166534">255</text>
    <text x="295" y="112" fill="#166534">255</text>
    <text x="380" y="112" fill="#166534">255</text>
    <text x="465" y="112" fill="#6d28d9">0</text>
  </g>
  <text x="295" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">NETWORK (mask = 255) = 192.168.1</text>
  <text x="465" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">HOST (0) = 10</text>
  <text x="620" y="90" font-size="12" fill="#475569">255 = 11111111 (all on)</text>
  <text x="620" y="110" font-size="12" fill="#475569">0   = 00000000 (all off)</text>

  <!-- default masks -->
  <rect x="30" y="175" width="360" height="150" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="210" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Default masks</text>
  <g font-size="14" fill="#111">
    <text x="55" y="230" font-weight="bold" fill="#1e3a8a">Class A</text><text x="150" y="230" font-family="monospace">255.0.0.0</text><text x="320" y="230" font-size="11" fill="#475569">1 oct</text>
    <text x="55" y="262" font-weight="bold" fill="#1e3a8a">Class B</text><text x="150" y="262" font-family="monospace">255.255.0.0</text><text x="320" y="262" font-size="11" fill="#475569">2 oct</text>
    <text x="55" y="294" font-weight="bold" fill="#1e3a8a">Class C</text><text x="150" y="294" font-family="monospace">255.255.255.0</text><text x="320" y="294" font-size="11" fill="#475569">3 oct</text>
  </g>

  <!-- same network test -->
  <rect x="410" y="175" width="460" height="150" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Same network? (mask 255.255.255.0)</text>

  <text x="430" y="235" font-size="13" font-family="monospace" fill="#111">192.168.1.10  &amp;  192.168.1.20</text>
  <text x="720" y="235" font-size="13" font-weight="bold" fill="#166534">✅ same → direct</text>
  <text x="430" y="258" font-size="11" fill="#475569">192.168.1 = 192.168.1</text>

  <line x1="430" y1="272" x2="850" y2="272" stroke="#cbd5e1" stroke-width="1"/>

  <text x="430" y="295" font-size="13" font-family="monospace" fill="#111">192.168.1.10  &amp;  192.168.2.20</text>
  <text x="720" y="295" font-size="13" font-weight="bold" fill="#b91c1c">❌ differ → router</text>
  <text x="430" y="315" font-size="11" fill="#475569">192.168.1 ≠ 192.168.2</text>

  <!-- caption -->
  <text x="450" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">The mask is a highlighter: 255 = network, 0 = host.</text>
  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#475569">Same network → deliver directly.   Different network → send to the router (gateway).</text>

  <!-- mailing analogy strip -->
  <rect x="120" y="415" width="660" height="55" rx="8" fill="#fffbeb" stroke="#a16207" stroke-width="1.5"/>
  <text x="450" y="438" text-anchor="middle" font-size="12" fill="#78350f">Like mail: highlight the TOWN (network), leave the HOUSE NUMBER (host) plain.</text>
  <text x="450" y="457" text-anchor="middle" font-size="12" fill="#78350f">Same town → a neighbor carries it. Different town → the post office (router) routes it.</text>
</svg>
