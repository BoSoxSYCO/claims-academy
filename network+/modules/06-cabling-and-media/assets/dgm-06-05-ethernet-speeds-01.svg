<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Reading an Ethernet name and the copper speed ladder</title>
  <desc id="desc">A breakdown of the name 1000BASE-T into speed 1000 megabits, BASE for normal Ethernet, and T for twisted-pair copper, then a ladder of four copper standards: 10BASE-T at 10 megabits on Cat3, 100BASE-TX at 100 megabits on Cat5, 1000BASE-T at 1 gigabit on Cat5e, and 10GBASE-T at 10 gigabits on Cat6a, all to 100 meters, with a note that auto-negotiation picks the fastest shared speed and the slowest part of the link wins.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Reading an Ethernet name</text>

  <!-- Decode 1000BASE-T -->
  <rect x="250" y="55" width="120" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="310" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">1000</text>
  <rect x="370" y="55" width="110" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="425" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">BASE</text>
  <rect x="480" y="55" width="60" height="46" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="510" y="84" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">T</text>

  <line x1="310" y1="101" x2="310" y2="122" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="138" font-size="12" fill="#1d4ed8">speed = 1000 Mbps (1 Gbps)</text>
  <line x1="425" y1="101" x2="425" y2="122" stroke="#334155" stroke-width="2"/>
  <text x="425" y="138" text-anchor="middle" font-size="12" fill="#334155">normal Ethernet</text>
  <line x1="510" y1="101" x2="510" y2="122" stroke="#166534" stroke-width="2"/>
  <text x="600" y="138" font-size="12" fill="#166534">medium: T = copper (F/S/L = fiber)</text>

  <!-- Speed ladder -->
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Common copper standards — need a good-enough cable</text>
  <g stroke="#334155" stroke-width="2" font-size="13">
    <rect x="90"  y="192" width="720" height="42" rx="6" fill="#fee2e2"/>
    <rect x="90"  y="238" width="720" height="42" rx="6" fill="#fed7aa"/>
    <rect x="90"  y="284" width="720" height="42" rx="6" fill="#fef08a"/>
    <rect x="90"  y="330" width="720" height="42" rx="6" fill="#bbf7d0"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#111">
    <text x="110" y="219">10BASE-T</text>
    <text x="110" y="265">100BASE-TX</text>
    <text x="110" y="311">1000BASE-T</text>
    <text x="110" y="357">10GBASE-T</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="330" y="219">10 Mbps</text>
    <text x="330" y="265">100 Mbps  (Fast Ethernet)</text>
    <text x="330" y="311">1 Gbps  (Gigabit Ethernet)</text>
    <text x="330" y="357">10 Gbps</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#166534">
    <text x="640" y="219">Cat3+ · 100 m</text>
    <text x="640" y="265">Cat5+ · 100 m</text>
    <text x="640" y="311">Cat5e+ · 100 m</text>
    <text x="640" y="357">Cat6a · 100 m</text>
  </g>

  <!-- notes -->
  <rect x="90" y="392" width="720" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Auto-negotiation picks the fastest speed both devices share.</text>
  <text x="450" y="438" text-anchor="middle" font-size="12" fill="#1e3a8a">The SLOWEST part of the link (device, port, or cable) sets the real speed.</text>
</svg>
