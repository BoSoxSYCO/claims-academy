<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Cable faults, test tools, and a check-basics-first flow</title>
  <desc id="desc">Three wire states — a good wire with continuity, an open with a break, and a short with two wires touching — then a cable tester whose eight pin lights show pass or fault in text, a tone generator and probe tracing one cable in a bundle, and a numbered check-the-basics-first flow: link light, re-seat, swap a known-good cable, check length and route, test, then trace.</desc>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Cable faults and how to find them</text>

  <!-- three wire states -->
  <text x="60" y="62" font-size="14" font-weight="bold" fill="#111">Wire states</text>
  <!-- good -->
  <circle cx="70" cy="88" r="6" fill="#166534"/><line x1="76" y1="88" x2="250" y2="88" stroke="#166534" stroke-width="3"/><circle cx="256" cy="88" r="6" fill="#166534"/>
  <text x="300" y="92" font-size="12" fill="#166534">GOOD — continuity end to end ✓</text>
  <!-- open -->
  <circle cx="70" cy="118" r="6" fill="#b91c1c"/><line x1="76" y1="118" x2="150" y2="118" stroke="#b91c1c" stroke-width="3"/>
  <text x="163" y="123" font-size="14" fill="#b91c1c">✗</text>
  <line x1="182" y1="118" x2="250" y2="118" stroke="#b91c1c" stroke-width="3"/><circle cx="256" cy="118" r="6" fill="#b91c1c"/>
  <text x="300" y="122" font-size="12" fill="#b91c1c">OPEN — a broken wire, no signal ✗</text>
  <!-- short -->
  <circle cx="70" cy="150" r="6" fill="#b45309"/><line x1="76" y1="146" x2="256" y2="146" stroke="#b45309" stroke-width="3"/><line x1="76" y1="156" x2="256" y2="156" stroke="#b45309" stroke-width="3"/>
  <line x1="150" y1="146" x2="150" y2="156" stroke="#b45309" stroke-width="3"/>
  <text x="300" y="153" font-size="12" fill="#b45309">SHORT — two wires touching ✗</text>

  <!-- tools -->
  <text x="60" y="200" font-size="14" font-weight="bold" fill="#111">Tools</text>
  <!-- cable tester -->
  <rect x="60" y="212" width="360" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Cable tester</text>
  <g>
    <circle cx="90" cy="262" r="8" fill="#166534"/><text x="90" y="286" text-anchor="middle" font-size="9" fill="#166534">1✓</text>
    <circle cx="128" cy="262" r="8" fill="#166534"/><text x="128" y="286" text-anchor="middle" font-size="9" fill="#166534">2✓</text>
    <circle cx="166" cy="262" r="8" fill="#166534"/><text x="166" y="286" text-anchor="middle" font-size="9" fill="#166534">3✓</text>
    <circle cx="204" cy="262" r="8" fill="#b91c1c"/><text x="204" y="286" text-anchor="middle" font-size="9" fill="#b91c1c">4✗</text>
    <circle cx="242" cy="262" r="8" fill="#166534"/><text x="242" y="286" text-anchor="middle" font-size="9" fill="#166534">5✓</text>
    <circle cx="280" cy="262" r="8" fill="#166534"/><text x="280" y="286" text-anchor="middle" font-size="9" fill="#166534">6✓</text>
    <circle cx="318" cy="262" r="8" fill="#166534"/><text x="318" y="286" text-anchor="middle" font-size="9" fill="#166534">7✓</text>
    <circle cx="356" cy="262" r="8" fill="#166534"/><text x="356" y="286" text-anchor="middle" font-size="9" fill="#166534">8✓</text>
  </g>
  <text x="240" y="299" text-anchor="middle" font-size="10" fill="#1e3a8a">lights each pin: ✓ pass / ✗ fault (here pin 4 = open)</text>

  <!-- toner -->
  <rect x="440" y="212" width="400" height="90" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="640" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Tone generator + probe</text>
  <rect x="460" y="250" width="70" height="34" rx="5" fill="#fff" stroke="#166534" stroke-width="2"/><text x="495" y="272" text-anchor="middle" font-size="11" fill="#166534">tone gen</text>
  <text x="548" y="272" font-size="14" fill="#166534">)))</text>
  <line x1="565" y1="267" x2="700" y2="267" stroke="#94a3b8" stroke-width="6"/>
  <line x1="565" y1="277" x2="700" y2="277" stroke="#cbd5e1" stroke-width="6"/>
  <line x1="565" y1="257" x2="700" y2="257" stroke="#cbd5e1" stroke-width="6"/>
  <text x="712" y="272" font-size="14" fill="#166534">(((</text>
  <rect x="735" y="250" width="70" height="34" rx="5" fill="#fff" stroke="#166534" stroke-width="2"/><text x="770" y="272" text-anchor="middle" font-size="11" fill="#166534">probe</text>
  <text x="640" y="299" text-anchor="middle" font-size="10" fill="#14532d">beeps on the matching cable in a bundle</text>

  <!-- check basics flow -->
  <text x="60" y="340" font-size="14" font-weight="bold" fill="#111">Check the basics first</text>
  <g font-size="11.5">
    <rect x="55"  y="352" width="120" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="115" y="372" text-anchor="middle" fill="#111">1. Link light?</text><text x="115" y="388" text-anchor="middle" fill="#111">seated?</text>
    <rect x="195" y="352" width="110" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="250" y="378" text-anchor="middle" fill="#111">2. Re-seat</text>
    <rect x="325" y="352" width="150" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="400" y="372" text-anchor="middle" fill="#111">3. Swap a</text><text x="400" y="388" text-anchor="middle" fill="#111">known-good cable</text>
    <rect x="495" y="352" width="140" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="565" y="372" text-anchor="middle" fill="#111">4. Length /</text><text x="565" y="388" text-anchor="middle" fill="#111">route (EMI)</text>
    <rect x="655" y="352" width="90" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="700" y="378" text-anchor="middle" fill="#111">5. Test</text>
    <rect x="765" y="352" width="80" height="44" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/><text x="805" y="378" text-anchor="middle" fill="#111">6. Trace</text>
  </g>
  <g stroke="#334155" stroke-width="2" marker-end="url(#fw)">
    <line x1="175" y1="374" x2="193" y2="374"/>
    <line x1="305" y1="374" x2="323" y2="374"/>
    <line x1="475" y1="374" x2="493" y2="374"/>
    <line x1="635" y1="374" x2="653" y2="374"/>
    <line x1="745" y1="374" x2="763" y2="374"/>
  </g>
  <defs>
    <marker id="fw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="450" y="440" text-anchor="middle" font-size="12" fill="#475569">Cheapest test first: swap in a cable you know is good — it solves most "no link" cases.</text>
  <text x="450" y="466" text-anchor="middle" font-size="11" fill="#64748b">Faults: open · short · miswire · split pair · attenuation (too long) · interference (EMI) · bad connector / kink.</text>
</svg>
