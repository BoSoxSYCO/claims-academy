<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">RJ45 connector and jack, RJ45 vs RJ11 size, and a building path</title>
  <desc id="desc">An RJ45 connector with eight pins and a locking tab beside an Ethernet jack, a size comparison showing the RJ45 is wider than the smaller RJ11 phone connector, and a path from a wall keystone jack through a patch panel to a switch joined by patch cables.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111111">Ethernet connectors and jacks</text>

  <!-- RJ45 connector -->
  <text x="150" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">RJ45 connector (plug)</text>
  <rect x="80" y="75" width="140" height="80" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
  <!-- 8 pins -->
  <g fill="#d4a017" stroke="#78350f" stroke-width="1">
    <rect x="92" y="82" width="10" height="22"/>
    <rect x="105" y="82" width="10" height="22"/>
    <rect x="118" y="82" width="10" height="22"/>
    <rect x="131" y="82" width="10" height="22"/>
    <rect x="144" y="82" width="10" height="22"/>
    <rect x="157" y="82" width="10" height="22"/>
    <rect x="170" y="82" width="10" height="22"/>
    <rect x="183" y="82" width="10" height="22"/>
  </g>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#0369a1">8 gold pins</text>
  <rect x="128" y="155" width="44" height="14" rx="3" fill="#38bdf8" stroke="#0369a1" stroke-width="2"/>
  <text x="150" y="184" text-anchor="middle" font-size="11" fill="#0369a1">locking tab</text>

  <!-- arrow to jack -->
  <line x1="230" y1="115" x2="290" y2="115" stroke="#111" stroke-width="2.5" marker-end="url(#fw)"/>
  <text x="260" y="106" text-anchor="middle" font-size="10" fill="#111">click</text>
  <defs>
    <marker id="fw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#111"/>
    </marker>
  </defs>

  <!-- Jack -->
  <text x="370" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Jack (socket)</text>
  <rect x="300" y="80" width="140" height="80" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <rect x="330" y="100" width="80" height="40" rx="4" fill="#0f172a"/>
  <rect x="352" y="98" width="36" height="10" fill="#0f172a"/>
  <text x="370" y="152" text-anchor="middle" font-size="11" fill="#334155">Ethernet port</text>

  <!-- RJ45 vs RJ11 -->
  <text x="640" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Size: RJ45 vs RJ11</text>
  <rect x="540" y="85" width="90" height="55" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="585" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">RJ45</text>
  <text x="585" y="155" text-anchor="middle" font-size="10" fill="#0369a1">8 pins · Ethernet</text>
  <rect x="680" y="97" width="55" height="43" rx="5" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
  <text x="707" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">RJ11</text>
  <text x="758" y="155" text-anchor="middle" font-size="10" fill="#9d174d">smaller · phone</text>

  <!-- Building path -->
  <text x="450" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">In a building: cables end at jacks and panels</text>
  <g stroke="#334155" stroke-width="2" font-size="12" text-anchor="middle">
    <rect x="60"  y="260" width="150" height="70" rx="8" fill="#dcfce7"/>
    <rect x="375" y="260" width="150" height="70" rx="8" fill="#fef9c3"/>
    <rect x="690" y="260" width="150" height="70" rx="8" fill="#dbeafe"/>
  </g>
  <text x="135" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Wall keystone</text>
  <text x="135" y="308" text-anchor="middle" font-size="11" fill="#166534">jack in a wall plate</text>
  <text x="450" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Patch panel</text>
  <text x="450" y="308" text-anchor="middle" font-size="11" fill="#78350f">many jacks (cables end)</text>
  <text x="765" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Switch</text>
  <text x="765" y="308" text-anchor="middle" font-size="11" fill="#1e40af">the network device</text>

  <line x1="210" y1="295" x2="373" y2="295" stroke="#111" stroke-width="2" marker-end="url(#fw)"/>
  <line x1="525" y1="295" x2="688" y2="295" stroke="#111" stroke-width="2" marker-end="url(#fw)"/>
  <text x="291" y="285" text-anchor="middle" font-size="10" fill="#475569">patch cable</text>
  <text x="606" y="285" text-anchor="middle" font-size="10" fill="#475569">patch cable</text>

  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#475569">Connector (plug) → jack (socket). RJ45 locks with a tab; a broken tab = loose, blinking link.</text>
</svg>
