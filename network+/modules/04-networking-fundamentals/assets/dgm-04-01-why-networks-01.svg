<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Why networks exist: standalone versus connected</title>
  <desc id="desc">On the left, three standalone computers are isolated and must carry files by hand; on the right, the same computers are connected through a switch and router to a shared printer and the internet, able to share resources and communicate.</desc>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">Why networks exist</text>

  <!-- divider -->
  <line x1="450" y1="55" x2="450" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- LEFT: standalone -->
  <text x="225" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">WITHOUT a network (standalone)</text>
  <g>
    <rect x="70" y="100" width="80" height="55" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="110" y="133" text-anchor="middle" font-size="12" fill="#374151">PC</text>
    <rect x="185" y="100" width="80" height="55" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="225" y="133" text-anchor="middle" font-size="12" fill="#374151">PC</text>
    <rect x="300" y="100" width="80" height="55" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="340" y="133" text-anchor="middle" font-size="12" fill="#374151">PC</text>
  </g>
  <text x="150" y="180" text-anchor="middle" font-size="26" fill="#dc2626">&#10007;</text>
  <text x="265" y="180" text-anchor="middle" font-size="26" fill="#dc2626">&#10007;</text>
  <text x="225" y="215" text-anchor="middle" font-size="13" fill="#9a3412">isolated — no connections</text>
  <!-- sneakernet USB -->
  <rect x="170" y="235" width="110" height="34" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <text x="225" y="257" text-anchor="middle" font-size="12" fill="#9a3412">carry files by hand (USB)</text>
  <text x="225" y="292" text-anchor="middle" font-size="12" fill="#6b7280">"sneakernet" — slow</text>

  <!-- RIGHT: networked -->
  <text x="675" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">WITH a network (connected)</text>
  <!-- switch/router center -->
  <rect x="620" y="180" width="110" height="40" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <text x="675" y="205" text-anchor="middle" font-size="13" fill="#166534">Switch / Router</text>
  <!-- PCs -->
  <rect x="500" y="100" width="70" height="45" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="535" y="128" text-anchor="middle" font-size="11" fill="#1e40af">PC</text>
  <rect x="500" y="255" width="70" height="45" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="535" y="283" text-anchor="middle" font-size="11" fill="#1e40af">PC</text>
  <!-- printer -->
  <rect x="620" y="255" width="110" height="45" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="675" y="283" text-anchor="middle" font-size="11" fill="#6d28d9">Printer (shared)</text>
  <!-- internet -->
  <ellipse cx="800" cy="200" rx="60" ry="34" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/><text x="800" y="205" text-anchor="middle" font-size="12" fill="#1e40af">Internet</text>
  <!-- links -->
  <line x1="570" y1="122" x2="640" y2="180" stroke="#166534" stroke-width="3"/>
  <line x1="570" y1="277" x2="640" y2="220" stroke="#166534" stroke-width="3"/>
  <line x1="675" y1="220" x2="675" y2="255" stroke="#166534" stroke-width="3"/>
  <line x1="730" y1="197" x2="742" y2="199" stroke="#166534" stroke-width="3"/>
  <text x="675" y="330" text-anchor="middle" font-size="13" fill="#166534">share files · printer · internet — and communicate</text>
</svg>
