<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">A home network as nodes and links</title>
  <desc id="desc">A small home network with a router in the center; a laptop and a switch connect by solid wired links, and a phone and a smart TV connect by dashed wireless links; each device is labeled a node and each connection a link.</desc>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A network = nodes joined by links</text>

  <!-- Router center -->
  <rect x="390" y="185" width="120" height="55" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <text x="450" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Router</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#166534">(node)</text>

  <!-- Laptop (wired, top-left) -->
  <rect x="120" y="90" width="120" height="55" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" font-size="14" fill="#1e40af">Laptop</text>
  <text x="180" y="132" text-anchor="middle" font-size="11" fill="#1e40af">(node)</text>
  <line x1="240" y1="130" x2="395" y2="195" stroke="#1e40af" stroke-width="4"/>
  <text x="300" y="150" text-anchor="middle" font-size="12" fill="#1e40af">wired link</text>

  <!-- Switch (wired, bottom-left) -->
  <rect x="120" y="285" width="120" height="55" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="180" y="310" text-anchor="middle" font-size="14" fill="#1e40af">Switch</text>
  <text x="180" y="327" text-anchor="middle" font-size="11" fill="#1e40af">(node)</text>
  <line x1="240" y1="300" x2="395" y2="230" stroke="#1e40af" stroke-width="4"/>
  <text x="300" y="290" text-anchor="middle" font-size="12" fill="#1e40af">wired link</text>

  <!-- Phone (wireless, top-right) -->
  <rect x="660" y="90" width="120" height="55" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="720" y="115" text-anchor="middle" font-size="14" fill="#6d28d9">Phone</text>
  <text x="720" y="132" text-anchor="middle" font-size="11" fill="#6d28d9">(node)</text>
  <line x1="660" y1="130" x2="505" y2="195" stroke="#6d28d9" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="600" y="150" text-anchor="middle" font-size="12" fill="#6d28d9">wireless link</text>

  <!-- Smart TV (wireless, bottom-right) -->
  <rect x="660" y="285" width="120" height="55" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="720" y="310" text-anchor="middle" font-size="14" fill="#6d28d9">Smart TV</text>
  <text x="720" y="327" text-anchor="middle" font-size="11" fill="#6d28d9">(node)</text>
  <line x1="660" y1="300" x2="505" y2="230" stroke="#6d28d9" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="600" y="290" text-anchor="middle" font-size="12" fill="#6d28d9">wireless link</text>

  <!-- legend -->
  <rect x="300" y="370" width="300" height="36" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <line x1="315" y1="388" x2="355" y2="388" stroke="#1e40af" stroke-width="4"/>
  <text x="415" y="392" text-anchor="middle" font-size="12" fill="#111">solid = wired</text>
  <line x1="470" y1="388" x2="510" y2="388" stroke="#6d28d9" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="560" y="392" text-anchor="middle" font-size="12" fill="#111">dashed = wireless</text>
</svg>
