<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Bandwidth, throughput, and latency as a highway</title>
  <desc id="desc">A highway shown as three stacked strips. The top strip has many lanes and is labeled bandwidth, the capacity, measured in megabits per second. The middle strip has a few cars and is labeled throughput, the real flow, measured in megabits per second. The bottom strip has one car with a timer arrow and is labeled latency, the trip time, measured in milliseconds.</desc>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">A network link is like a highway</text>

  <!-- BANDWIDTH strip -->
  <rect x="40" y="60" width="820" height="110" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="55" y="84" font-size="16" font-weight="bold" fill="#1e3a8a">BANDWIDTH — how many lanes (capacity) · Mbps / Gbps</text>
  <g stroke="#1e3a8a" stroke-width="2" stroke-dasharray="14 10">
    <line x1="55" y1="108" x2="845" y2="108"/>
    <line x1="55" y1="128" x2="845" y2="128"/>
    <line x1="55" y1="148" x2="845" y2="148"/>
  </g>
  <text x="850" y="165" text-anchor="end" font-size="11" fill="#1e3a8a">more lanes = can carry more</text>

  <!-- THROUGHPUT strip -->
  <rect x="40" y="185" width="820" height="110" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="55" y="209" font-size="16" font-weight="bold" fill="#166534">THROUGHPUT — cars that actually get through (real flow) · Mbps</text>
  <line x1="55" y1="255" x2="845" y2="255" stroke="#166534" stroke-width="1.5"/>
  <g fill="#166534">
    <rect x="120" y="240" width="34" height="20" rx="4"/>
    <rect x="230" y="240" width="34" height="20" rx="4"/>
    <rect x="470" y="240" width="34" height="20" rx="4"/>
    <rect x="690" y="240" width="34" height="20" rx="4"/>
  </g>
  <text x="850" y="285" text-anchor="end" font-size="11" fill="#166534">fewer cars if there's traffic (usually &lt; bandwidth)</text>

  <!-- LATENCY strip -->
  <rect x="40" y="310" width="820" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="55" y="334" font-size="16" font-weight="bold" fill="#b91c1c">LATENCY — time for ONE car's trip (delay) · milliseconds (ms)</text>
  <text x="80" y="372" font-size="12" fill="#b91c1c">START</text>
  <rect x="128" y="360" width="34" height="20" rx="4" fill="#b91c1c"/>
  <line x1="170" y1="392" x2="800" y2="392" stroke="#b91c1c" stroke-width="2" marker-end="url(#a2)"/>
  <text x="820" y="372" text-anchor="end" font-size="12" fill="#b91c1c">END</text>
  <text x="485" y="415" text-anchor="middle" font-size="12" fill="#b91c1c">&lt;----- e.g. 20 ms trip time -----&gt;  (lower is better)</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="450" y="455" text-anchor="middle" font-size="12" fill="#475569">Two amounts (Mbps): bandwidth &amp; throughput.  One time (ms): latency.</text>
</svg>
