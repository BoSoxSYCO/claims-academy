<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Search to open a tool, and the taskbar</title>
  <desc id="desc">The Windows Start menu with a search box showing the typed words command prompt and a best-match result, and the taskbar below with pinned tool icons labeled.</desc>

  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Open anything: Windows key → type → Enter</text>

  <!-- Start menu panel -->
  <rect x="150" y="70" width="600" height="230" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="180" y="102" font-size="15" font-weight="bold" fill="#334155">Start menu</text>

  <!-- Search box -->
  <rect x="180" y="118" width="540" height="46" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="3"/>
  <text x="205" y="147" font-size="18" fill="#1e40af">&#128269;  command prompt</text>
  <text x="600" y="112" font-size="12" fill="#1e40af">← type a tool's name</text>

  <!-- Best match -->
  <rect x="180" y="180" width="540" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="200" font-size="13" fill="#64748b">Best match</text>
  <text x="200" y="218" font-size="16" font-weight="bold" fill="#111">▸ Command Prompt</text>
  <text x="560" y="210" font-size="13" fill="#166534">press Enter to open</text>

  <!-- pin hint -->
  <rect x="180" y="236" width="540" height="42" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
  <text x="200" y="262" font-size="14" fill="#166534">Tip: right-click the result → "Pin to taskbar" to keep it one click away</text>

  <!-- Taskbar -->
  <rect x="60" y="340" width="780" height="56" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">TASKBAR — one-click tools</text>
  <!-- taskbar icons -->
  <rect x="80" y="352" width="40" height="32" rx="5" fill="#1e40af"/>
  <text x="100" y="374" text-anchor="middle" font-size="16" fill="#fff">&#8862;</text>
  <text x="100" y="410" text-anchor="middle" font-size="11" fill="#334155">Start</text>
  <rect x="130" y="352" width="40" height="32" rx="5" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="150" y="374" text-anchor="middle" font-size="16" fill="#334155">&#128269;</text>
  <text x="150" y="410" text-anchor="middle" font-size="11" fill="#334155">Search</text>
  <rect x="180" y="352" width="40" height="32" rx="5" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="200" y="374" text-anchor="middle" font-size="16">&#128193;</text>
  <text x="200" y="410" text-anchor="middle" font-size="11" fill="#334155">Files</text>
  <rect x="230" y="352" width="40" height="32" rx="5" fill="#111827"/>
  <text x="250" y="374" text-anchor="middle" font-size="13" fill="#fff">&gt;_</text>
  <text x="250" y="410" text-anchor="middle" font-size="11" fill="#334155">Cmd</text>
</svg>
