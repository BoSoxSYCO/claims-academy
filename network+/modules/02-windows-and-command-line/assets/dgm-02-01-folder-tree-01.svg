<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">How Windows organizes files in a folder tree</title>
  <desc id="desc">A folder tree starting at the C drive, opening to Users, then a personal folder named You, then Documents, Pictures, and Downloads; inside Documents are two files, notes.txt and lab-log.txt, with the full path to notes.txt highlighted.</desc>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">How Windows organizes your files</text>

  <!-- drive -->
  <rect x="60" y="70" width="150" height="40" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="135" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">C:\ (drive)</text>

  <!-- Users -->
  <rect x="140" y="130" width="140" height="36" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="210" y="154" text-anchor="middle" font-size="15" fill="#92400e">📁 Users</text>
  <line x1="135" y1="110" x2="135" y2="148" stroke="#9ca3af" stroke-width="2"/>
  <line x1="135" y1="148" x2="140" y2="148" stroke="#9ca3af" stroke-width="2"/>

  <!-- You -->
  <rect x="220" y="186" width="140" height="36" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="290" y="210" text-anchor="middle" font-size="15" fill="#92400e">📁 You</text>
  <line x1="210" y1="166" x2="210" y2="204" stroke="#9ca3af" stroke-width="2"/>
  <line x1="210" y1="204" x2="220" y2="204" stroke="#9ca3af" stroke-width="2"/>

  <!-- Documents / Pictures / Downloads -->
  <rect x="300" y="242" width="150" height="34" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="375" y="265" text-anchor="middle" font-size="14" fill="#92400e">📁 Documents</text>
  <rect x="300" y="284" width="150" height="34" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="375" y="307" text-anchor="middle" font-size="14" fill="#92400e">📁 Pictures</text>
  <rect x="300" y="326" width="150" height="34" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="375" y="349" text-anchor="middle" font-size="14" fill="#92400e">📁 Downloads</text>
  <line x1="290" y1="222" x2="290" y2="343" stroke="#9ca3af" stroke-width="2"/>
  <line x1="290" y1="259" x2="300" y2="259" stroke="#9ca3af" stroke-width="2"/>
  <line x1="290" y1="301" x2="300" y2="301" stroke="#9ca3af" stroke-width="2"/>
  <line x1="290" y1="343" x2="300" y2="343" stroke="#9ca3af" stroke-width="2"/>

  <!-- files inside Documents -->
  <rect x="480" y="240" width="150" height="32" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="555" y="262" text-anchor="middle" font-size="13" fill="#374151">📄 notes.txt</text>
  <rect x="480" y="278" width="150" height="32" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="555" y="300" text-anchor="middle" font-size="13" fill="#374151">📄 lab-log.txt</text>
  <line x1="450" y1="259" x2="480" y2="256" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="259" x2="480" y2="294" stroke="#9ca3af" stroke-width="2"/>

  <!-- path callout -->
  <rect x="150" y="395" width="620" height="44" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="460" y="422" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">Path:  C:\Users\You\Documents\notes.txt</text>
</svg>
