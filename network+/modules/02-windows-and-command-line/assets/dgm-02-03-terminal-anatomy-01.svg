<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">The parts of a command line: prompt, command, and output</title>
  <desc id="desc">A Command Prompt window showing the prompt C colon Users You, a typed command ver, and the version output below it, with call-outs labeling the prompt, the command, and the output.</desc>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">The parts of a command</text>

  <!-- terminal window -->
  <rect x="120" y="70" width="660" height="220" rx="8" fill="#0b1020" stroke="#334155" stroke-width="3"/>
  <rect x="120" y="70" width="660" height="28" rx="8" fill="#1f2937"/>
  <text x="140" y="89" font-size="13" fill="#cbd5e1">Command Prompt</text>
  <circle cx="762" cy="84" r="6" fill="#ef4444"/>

  <!-- line 1: prompt + command -->
  <text x="150" y="140" font-size="17" font-family="monospace" fill="#9ca3af">C:\Users\You&gt;</text>
  <text x="330" y="140" font-size="17" font-family="monospace" fill="#60a5fa">ver</text>

  <!-- output -->
  <text x="150" y="185" font-size="16" font-family="monospace" fill="#4ade80">Microsoft Windows [Version 10.0.22631]</text>

  <!-- next prompt -->
  <text x="150" y="230" font-size="17" font-family="monospace" fill="#9ca3af">C:\Users\You&gt; _</text>

  <!-- callouts -->
  <text x="150" y="330" font-size="14" fill="#6b7280">▲ the PROMPT (you don't type this — ends in &gt; )</text>
  <text x="330" y="120" font-size="13" fill="#2563eb">▼ the COMMAND (what you type)</text>
  <text x="150" y="205" font-size="13" fill="#166534">▲ the OUTPUT (what the computer sends back)</text>

  <!-- rhythm strip -->
  <rect x="120" y="352" width="660" height="44" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="450" y="379" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">Rhythm:  see prompt → type command → press Enter → read output</text>
</svg>
