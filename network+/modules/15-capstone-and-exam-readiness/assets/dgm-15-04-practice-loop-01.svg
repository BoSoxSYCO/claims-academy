<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="pl-title pl-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="pl-title">The practice-exam loop: take, score, review, log, retake</title>
  <desc id="pl-desc">A five-stage loop. Take the exam in ninety minutes under real conditions. Score it as correct divided by ninety. Review every missed question and tag its domain — marked as the most important stage. Log the weak domains to feed Lesson 15-06. Retake with Practice Exam #2 and compare. An arrow loops back to the top.</desc>

  <rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#12263a">The practice-exam loop</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#3a4a5a">The review is where the points come from</text>

  <!-- Take -->
  <rect x="210" y="80" width="300" height="54" rx="8" fill="#eef3f8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="360" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#12263a">1. TAKE</text>
  <text x="360" y="123" text-anchor="middle" font-size="12" fill="#3a4a5a">90 min · real conditions · no blanks</text>
  <line x1="360" y1="134" x2="360" y2="162" stroke="#333" stroke-width="2"/>
  <polygon points="360,162 354,152 366,152" fill="#333"/>

  <!-- Score -->
  <rect x="210" y="162" width="300" height="54" rx="8" fill="#e6e0f2" stroke="#5b4a8a" stroke-width="2"/>
  <text x="360" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#12263a">2. SCORE</text>
  <text x="360" y="205" text-anchor="middle" font-size="12" fill="#3a4a5a">correct ÷ 90 = your percentage</text>
  <line x1="360" y1="216" x2="360" y2="244" stroke="#333" stroke-width="2"/>
  <polygon points="360,244 354,234 366,234" fill="#333"/>

  <!-- Review (highlighted) -->
  <rect x="180" y="244" width="360" height="60" rx="8" fill="#fdf0d5" stroke="#b5852a" stroke-width="3"/>
  <text x="360" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#12263a">3. REVIEW every miss — tag its DOMAIN</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#8a5a00">★ the most important stage ★</text>
  <line x1="360" y1="304" x2="360" y2="332" stroke="#333" stroke-width="2"/>
  <polygon points="360,332 354,322 366,322" fill="#333"/>

  <!-- Log -->
  <rect x="210" y="332" width="300" height="54" rx="8" fill="#dbeadd" stroke="#2e7d5b" stroke-width="2"/>
  <text x="360" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#12263a">4. LOG weak domains</text>
  <text x="360" y="375" text-anchor="middle" font-size="12" fill="#3a4a5a">feed Lesson 15-06 (weak-spot review)</text>
  <line x1="360" y1="386" x2="360" y2="414" stroke="#333" stroke-width="2"/>
  <polygon points="360,414 354,404 366,404" fill="#333"/>

  <!-- Retake -->
  <rect x="210" y="414" width="300" height="54" rx="8" fill="#12263a"/>
  <text x="360" y="437" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5. RETAKE with Exam #2 (15-05)</text>
  <text x="360" y="457" text-anchor="middle" font-size="12" fill="#e8eef5">compare your scores</text>

  <!-- loop back arrow -->
  <path d="M 210 441 H 90 V 107 H 210" fill="none" stroke="#4a6fa5" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="210,107 200,101 200,113" fill="#4a6fa5"/>
  <text x="60" y="280" text-anchor="middle" font-size="12" fill="#4a6fa5" transform="rotate(-90 60 280)">repeat the cycle</text>

  <text x="360" y="510" text-anchor="middle" font-size="13" fill="#12263a">80%+ strong · 70–79% close · under 70% review first</text>
</svg>
