<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="ed-title ed-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="ed-title">Exam-day game plan timeline</title>
  <desc id="ed-desc">A left-to-right exam-day plan for a 90-minute test with up to about 90 questions. If a Performance-Based Question appears, flag it and skip it. Otherwise answer the fast multiple-choice questions and bank the points. Then return to the flagged PBQs, guess any blanks because there is no penalty, and finally review and submit. The passing score is 720 out of 900, a scaled score.</desc>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#12263a">Exam-day game plan</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#3a4a5a">90 minutes · up to ~90 questions</text>

  <!-- Start -->
  <rect x="30" y="90" width="90" height="44" rx="8" fill="#eef3f8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="75" y="117" text-anchor="middle" font-size="13" fill="#12263a">Start</text>
  <line x1="120" y1="112" x2="152" y2="112" stroke="#333" stroke-width="2"/>

  <!-- Decision: PBQ? -->
  <polygon points="230,80 300,112 230,144 160,112" fill="#fdf0d5" stroke="#b5852a" stroke-width="2"/>
  <text x="230" y="108" text-anchor="middle" font-size="12" fill="#12263a">PBQ</text>
  <text x="230" y="123" text-anchor="middle" font-size="12" fill="#12263a">appears?</text>

  <!-- yes branch up -->
  <line x1="230" y1="80" x2="230" y2="40" stroke="#333" stroke-width="2"/>
  <text x="242" y="60" font-size="11" fill="#2e7d5b">yes</text>
  <rect x="300" y="20" width="180" height="40" rx="8" fill="#dbeadd" stroke="#2e7d5b" stroke-width="2"/>
  <text x="390" y="45" text-anchor="middle" font-size="12" fill="#12263a">FLAG it, skip for now</text>
  <line x1="230" y1="40" x2="300" y2="40" stroke="#333" stroke-width="2"/>

  <!-- no branch right -->
  <line x1="300" y1="112" x2="340" y2="112" stroke="#333" stroke-width="2"/>
  <text x="308" y="104" font-size="11" fill="#3a4a5a">no</text>

  <!-- Fast MC -->
  <rect x="340" y="90" width="180" height="44" rx="8" fill="#e6e0f2" stroke="#5b4a8a" stroke-width="2"/>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#12263a">Answer fast</text>
  <text x="430" y="126" text-anchor="middle" font-size="12" fill="#12263a">multiple-choice · bank points</text>
  <line x1="520" y1="112" x2="560" y2="112" stroke="#333" stroke-width="2"/>

  <!-- Return to flagged -->
  <rect x="560" y="90" width="180" height="44" rx="8" fill="#dbeadd" stroke="#2e7d5b" stroke-width="2"/>
  <text x="650" y="117" text-anchor="middle" font-size="12" fill="#12263a">Return to flagged PBQs</text>
  <!-- connect flag box down to return -->
  <line x1="480" y1="40" x2="650" y2="40" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="650" y1="40" x2="650" y2="90" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- down to guess -->
  <line x1="650" y1="134" x2="650" y2="180" stroke="#333" stroke-width="2"/>

  <!-- Guess blanks -->
  <rect x="560" y="180" width="180" height="44" rx="8" fill="#fdf0d5" stroke="#b5852a" stroke-width="2"/>
  <text x="650" y="200" text-anchor="middle" font-size="12" fill="#12263a">Guess any blanks</text>
  <text x="650" y="216" text-anchor="middle" font-size="12" fill="#12263a">(no penalty)</text>
  <line x1="560" y1="202" x2="520" y2="202" stroke="#333" stroke-width="2"/>

  <!-- Review/submit -->
  <rect x="340" y="180" width="180" height="44" rx="8" fill="#12263a"/>
  <text x="430" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Review → Submit</text>

  <!-- Footer -->
  <rect x="30" y="300" width="840" height="70" rx="8" fill="#eef3f8" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Pass = 720 / 900 (a scaled score, not a percent)</text>
  <text x="450" y="354" text-anchor="middle" font-size="13" fill="#3a4a5a">Fast points first · flag the slow PBQs · leave nothing blank · bring a valid photo ID</text>
</svg>
