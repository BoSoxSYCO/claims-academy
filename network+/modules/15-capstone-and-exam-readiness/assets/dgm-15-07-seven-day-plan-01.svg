<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="sd-title sd-desc" font-family="Segoe UI, Arial, sans-serif">
  <title id="sd-title">The 7-day pre-exam taper, counting down to exam day</title>
  <desc id="sd-desc">A seven-day countdown, each day with one job: Day 7 diagnose with Practice Exam #1; Day 6 drill the weakest domain; Day 5 drill the next domain plus spaced repeats; Day 4 re-measure with Practice Exam #2 and compare; Day 3 close gaps and practice PBQs; Day 2 light full pass plus a logistics check; Day 1 rest, prep, and sleep; Exam Day execute the game plan. The bars shrink toward Day 1 to show the workload tapering.</desc>

  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#12263a">The 7-day taper — sharpen, don't cram</text>

  <!-- Day columns; bar heights shrink toward exam day to show taper -->
  <!-- Day 7 -->
  <rect x="30" y="90" width="92" height="220" rx="8" fill="#eef3f8" stroke="#4a6fa5" stroke-width="2"/>
  <text x="76" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 7</text>
  <text x="76" y="134" text-anchor="middle" font-size="12" fill="#12263a">DIAGNOSE</text>
  <text x="76" y="154" text-anchor="middle" font-size="10" fill="#3a4a5a">Practice</text>
  <text x="76" y="167" text-anchor="middle" font-size="10" fill="#3a4a5a">Exam #1</text>
  <text x="76" y="180" text-anchor="middle" font-size="10" fill="#3a4a5a">list weak</text>
  <text x="76" y="193" text-anchor="middle" font-size="10" fill="#3a4a5a">domains</text>

  <!-- Day 6 -->
  <rect x="132" y="105" width="92" height="205" rx="8" fill="#e6e0f2" stroke="#5b4a8a" stroke-width="2"/>
  <text x="178" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 6</text>
  <text x="178" y="149" text-anchor="middle" font-size="12" fill="#12263a">DRILL</text>
  <text x="178" y="169" text-anchor="middle" font-size="10" fill="#3a4a5a">weakest</text>
  <text x="178" y="182" text-anchor="middle" font-size="10" fill="#3a4a5a">domain</text>

  <!-- Day 5 -->
  <rect x="234" y="120" width="92" height="190" rx="8" fill="#e6e0f2" stroke="#5b4a8a" stroke-width="2"/>
  <text x="280" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 5</text>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#12263a">DRILL</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#3a4a5a">next + spaced</text>

  <!-- Day 4 -->
  <rect x="336" y="120" width="92" height="190" rx="8" fill="#dbeadd" stroke="#2e7d5b" stroke-width="2"/>
  <text x="382" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 4</text>
  <text x="382" y="164" text-anchor="middle" font-size="11" fill="#12263a">RE-MEASURE</text>
  <text x="382" y="184" text-anchor="middle" font-size="10" fill="#3a4a5a">Exam #2</text>
  <text x="382" y="197" text-anchor="middle" font-size="10" fill="#3a4a5a">compare</text>

  <!-- Day 3 -->
  <rect x="438" y="140" width="92" height="170" rx="8" fill="#fdf0d5" stroke="#b5852a" stroke-width="2"/>
  <text x="484" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 3</text>
  <text x="484" y="184" text-anchor="middle" font-size="11" fill="#12263a">CLOSE GAPS</text>
  <text x="484" y="204" text-anchor="middle" font-size="10" fill="#3a4a5a">+ PBQ practice</text>

  <!-- Day 2 -->
  <rect x="540" y="165" width="92" height="145" rx="8" fill="#fdf0d5" stroke="#b5852a" stroke-width="2"/>
  <text x="586" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 2</text>
  <text x="586" y="209" text-anchor="middle" font-size="11" fill="#12263a">LIGHT + PREP</text>
  <text x="586" y="229" text-anchor="middle" font-size="10" fill="#3a4a5a">logistics check</text>

  <!-- Day 1 -->
  <rect x="642" y="200" width="92" height="110" rx="8" fill="#fde8e8" stroke="#b5452a" stroke-width="2"/>
  <text x="688" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#12263a">Day 1</text>
  <text x="688" y="244" text-anchor="middle" font-size="12" fill="#12263a">REST</text>
  <text x="688" y="264" text-anchor="middle" font-size="10" fill="#3a4a5a">light + sleep</text>

  <!-- Exam Day -->
  <rect x="744" y="90" width="126" height="220" rx="8" fill="#12263a"/>
  <text x="807" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">EXAM DAY</text>
  <text x="807" y="140" text-anchor="middle" font-size="11" fill="#e8eef5">EXECUTE</text>
  <text x="807" y="164" text-anchor="middle" font-size="10" fill="#cdd8e6">brain dump</text>
  <text x="807" y="181" text-anchor="middle" font-size="10" fill="#cdd8e6">flag PBQs</text>
  <text x="807" y="198" text-anchor="middle" font-size="10" fill="#cdd8e6">bank the MC</text>
  <text x="807" y="215" text-anchor="middle" font-size="10" fill="#cdd8e6">no blanks</text>
  <text x="807" y="232" text-anchor="middle" font-size="10" fill="#cdd8e6">watch the clock</text>

  <!-- taper arrow -->
  <line x1="30" y1="340" x2="870" y2="340" stroke="#4a6fa5" stroke-width="2"/>
  <polygon points="870,340 858,334 858,346" fill="#4a6fa5"/>
  <text x="120" y="360" font-size="12" fill="#3a4a5a">heavier work early…</text>
  <text x="660" y="360" font-size="12" fill="#3a4a5a">…taper to rest before exam day</text>

  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#12263a">Sharpen, don't cram. Trust two solid practice scores.</text>
</svg>
