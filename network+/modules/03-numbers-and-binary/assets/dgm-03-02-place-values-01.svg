<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Reading a byte with binary place values</title>
  <desc id="desc">A byte drawn as eight columns with place values 128 down to 1 on top and an example bit pattern below; the columns with a 1 (the 8 and the 2) are highlighted and summed to 10, with a note that all bits on equals 255.</desc>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">Read a byte: add the "on" place values</text>

  <!-- 8 columns, x from 70 step 95 -->
  <!-- place values 128 64 32 16 8 4 2 1 ; bits 0 0 0 0 1 0 1 0 -->
  <!-- headers row -->
  <g font-family="Arial" font-size="20" font-weight="bold">
    <rect x="70"  y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="112" y="113" text-anchor="middle" fill="#3730a3">128</text>
    <rect x="165" y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="207" y="113" text-anchor="middle" fill="#3730a3">64</text>
    <rect x="260" y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="302" y="113" text-anchor="middle" fill="#3730a3">32</text>
    <rect x="355" y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="397" y="113" text-anchor="middle" fill="#3730a3">16</text>
    <rect x="450" y="80" width="85" height="50" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
    <text x="492" y="113" text-anchor="middle" fill="#166534">8</text>
    <rect x="545" y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="587" y="113" text-anchor="middle" fill="#3730a3">4</text>
    <rect x="640" y="80" width="85" height="50" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
    <text x="682" y="113" text-anchor="middle" fill="#166534">2</text>
    <rect x="735" y="80" width="85" height="50" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="777" y="113" text-anchor="middle" fill="#3730a3">1</text>
  </g>
  <text x="45" y="113" text-anchor="end" font-size="13" fill="#555">place</text>

  <!-- bit row -->
  <g font-family="monospace" font-size="24" font-weight="bold">
    <rect x="70"  y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="112" y="169" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="165" y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="207" y="169" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="260" y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="302" y="169" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="355" y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="397" y="169" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="450" y="135" width="85" height="50" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><text x="492" y="169" text-anchor="middle" fill="#166534">1</text>
    <rect x="545" y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="587" y="169" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="640" y="135" width="85" height="50" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><text x="682" y="169" text-anchor="middle" fill="#166534">1</text>
    <rect x="735" y="135" width="85" height="50" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="777" y="169" text-anchor="middle" fill="#6b7280">0</text>
  </g>
  <text x="45" y="169" text-anchor="end" font-size="13" fill="#555">bit</text>

  <!-- sum -->
  <text x="450" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">8  +  2  =  10</text>
  <text x="450" y="262" text-anchor="middle" font-size="14" fill="#444">Only the 8 and 2 columns are "on" (1). Add them → 10.</text>

  <!-- max note -->
  <rect x="180" y="290" width="540" height="56" rx="10" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <text x="450" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">All 8 bits on: 128+64+32+16+8+4+2+1 = 255</text>
  <text x="450" y="335" text-anchor="middle" font-size="13" fill="#111">A byte counts 0 to 255 (256 values).</text>
</svg>
