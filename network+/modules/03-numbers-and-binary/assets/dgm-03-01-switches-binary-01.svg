<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">A computer stores data as on/off switches (bits)</title>
  <desc id="desc">A row of eight light switches, some up and some down, each labeled with a 1 (on) or 0 (off) below it, showing that a computer stores data as patterns of on/off bits. Eight bits make one byte.</desc>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111111">A computer = a wall of on/off switches</text>
  <text x="450" y="66" text-anchor="middle" font-size="15" fill="#444">on = 1 · off = 0 · each switch is one bit</text>

  <!-- 8 switches: pattern 1 0 1 1 0 0 1 0 -->
  <!-- switch generator positions -->
  <!-- switch 1 ON -->
  <g>
    <!-- ON switches green up, OFF gray down -->
  </g>
  <!-- We draw each switch as a rounded box with a toggle -->
  <!-- helper values: x positions 60,160,260,360,460,560,660,760 ; bits 1,0,1,1,0,0,1,0 -->

  <!-- Switch 1: ON (1) -->
  <rect x="60" y="100" width="70" height="120" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <rect x="75" y="112" width="40" height="45" rx="6" fill="#166534"/>
  <text x="95" y="140" text-anchor="middle" font-size="13" fill="#fff">ON</text>
  <text x="95" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">1</text>

  <!-- Switch 2: OFF (0) -->
  <rect x="160" y="100" width="70" height="120" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="175" y="163" width="40" height="45" rx="6" fill="#9ca3af"/>
  <text x="195" y="191" text-anchor="middle" font-size="13" fill="#fff">OFF</text>
  <text x="195" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#374151">0</text>

  <!-- Switch 3: ON (1) -->
  <rect x="260" y="100" width="70" height="120" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <rect x="275" y="112" width="40" height="45" rx="6" fill="#166534"/>
  <text x="295" y="140" text-anchor="middle" font-size="13" fill="#fff">ON</text>
  <text x="295" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">1</text>

  <!-- Switch 4: ON (1) -->
  <rect x="360" y="100" width="70" height="120" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <rect x="375" y="112" width="40" height="45" rx="6" fill="#166534"/>
  <text x="395" y="140" text-anchor="middle" font-size="13" fill="#fff">ON</text>
  <text x="395" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">1</text>

  <!-- Switch 5: OFF (0) -->
  <rect x="460" y="100" width="70" height="120" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="475" y="163" width="40" height="45" rx="6" fill="#9ca3af"/>
  <text x="495" y="191" text-anchor="middle" font-size="13" fill="#fff">OFF</text>
  <text x="495" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#374151">0</text>

  <!-- Switch 6: OFF (0) -->
  <rect x="560" y="100" width="70" height="120" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="575" y="163" width="40" height="45" rx="6" fill="#9ca3af"/>
  <text x="595" y="191" text-anchor="middle" font-size="13" fill="#fff">OFF</text>
  <text x="595" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#374151">0</text>

  <!-- Switch 7: ON (1) -->
  <rect x="660" y="100" width="70" height="120" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="3"/>
  <rect x="675" y="112" width="40" height="45" rx="6" fill="#166534"/>
  <text x="695" y="140" text-anchor="middle" font-size="13" fill="#fff">ON</text>
  <text x="695" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">1</text>

  <!-- Switch 8: OFF (0) -->
  <rect x="760" y="100" width="70" height="120" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="775" y="163" width="40" height="45" rx="6" fill="#9ca3af"/>
  <text x="795" y="191" text-anchor="middle" font-size="13" fill="#fff">OFF</text>
  <text x="795" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#374151">0</text>

  <!-- byte bracket -->
  <line x1="60" y1="275" x2="830" y2="275" stroke="#3730a3" stroke-width="2"/>
  <text x="450" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">8 bits = 1 byte  (you'll meet bytes in the next lesson)</text>
  <text x="450" y="340" text-anchor="middle" font-size="14" fill="#444">Only two states → simple and reliable. Every photo, song, and address is a pattern like this.</text>
</svg>
