# OPTIONAL HTTPS overlay. Use only if you want https:// on your LAN.
# Run WITH the base file:
#   SITE_HOST=networkcity.lan docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Caddy issues a certificate from its own local CA ("tls internal"); to avoid
# browser warnings, trust Caddy's root CA on your devices (see DEPLOY.md).
services:
  network-city:
    # stop publishing HTTP directly; traffic now comes through Caddy
    ports: !reset []
    expose:
      - "80"
  caddy:
    image: caddy:2-alpine
    container_name: network-city-caddy
    depends_on:
      - network-city
    environment:
      SITE_HOST: ${SITE_HOST:-networkcity.lan}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
