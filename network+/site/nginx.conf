server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Starlight builds directory-style pages (…/lesson/index.html),
    # so directory URLs resolve via $uri/. Fall back to the 404 page.
    location / {
        try_files $uri $uri/ /404.html;
    }

    # long-cache the hashed assets Astro emits
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
